<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Árbol de Amor Animado</title>

    <meta
        name="author"
        content="Zero"
    >

    <meta
        name="copyright"
        content="Zero - Código libre no comercial"
    >

    <meta
        name="description"
        content="Árbol de Amor Animado"
    >

    <!-- CSS PRINCIPAL -->
    <link
        rel="stylesheet"
        href="Css/style.css"
    >

    <!-- CSS MÓVIL -->
    <link
        rel="stylesheet"
        href="Css/style.mobile.css"
        media="only screen and (max-width: 700px)"
    >

    <style>

        .tree-container {

            position: absolute;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            width: 400px;
            height: 400px;

            z-index: 2;
        }

        .animated-heart {

            transform-origin: center;

            animation:
                beat 1s infinite;
        }

        @keyframes beat {

            0%, 100% {
                transform: scale(1);
            }

            20% {
                transform: scale(1.1);
            }

            40% {
                transform: scale(.95);
            }

            60% {
                transform: scale(1.08);
            }

            80% {
                transform: scale(1);
            }

        }

    </style>

</head>


<body>

    <!-- =================================================
         PÉTALOS
    ================================================== -->

    <div
        id="floating-objects"
    ></div>


    <!-- =================================================
         TEXTO DE DEDICATORIA
    ================================================== -->

    <div
        class="dedication-text"
        id="dedication-text"
    >

        <div
            class="signature"
            id="signature"
        ></div>

    </div>


    <!-- =================================================
         CONTADOR
    ================================================== -->

    <div
        class="countdown"
        id="countdown"
    ></div>


    <!-- =================================================
         ÁRBOL
    ================================================== -->

    <div
        id="tree-container"
        class="tree-container"
    ></div>


    <!-- =================================================
         FOTOS A LA DERECHA DEL ÁRBOL
    ================================================== -->

    <div class="side-photos">

        <div class="side-photo photo-1">

            <img
                src="Img/Nosotros.jpeg"
                alt="Nosotros"
            >

        </div>


        <div class="side-photo photo-2">

            <img
                src="Img/TedYTracy.jpg"
                alt="Por siempre"
            >

        </div>


        <div class="side-photo photo-3">

            <img
                src="Img/Nosotros1.jpeg"
                alt="Nosotros"
            >

        </div>

    </div>


    <!-- =================================================
         MÚSICA
    ================================================== -->

    <audio
        src="Music/Josean Log - Chachachá (Lyric Video).mp3"
        id="bg-music"
        preload="auto"
    ></audio>


    <!-- =================================================
         SCRIPT PRINCIPAL
    ================================================== -->

    <script src="Js/script.js"></script>

</body>

</html>
